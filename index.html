<!doctype html>
<html lang="pt-PT" data-arte="blocos" data-design="trilha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a44">
<title>O Segredo do Farol · Gustavo Aventureiro</title>
<link rel="stylesheet" href="jogo.css">
</head>
<body>
<canvas id="mundo" role="img" aria-label="Mundo do jogo: o trilho junto ao mar até ao farol"></canvas>

<div id="hud" hidden>
  <div class="hud-esq">
    <span class="pill" id="h-pontos" title="Pontos"></span>
    <span class="pill" id="h-tesouros" title="Tesouros"></span>
    <span class="pill" id="h-conchas" title="Conchas"></span>
  </div>
  <div class="hud-fase" id="h-fase"></div>
  <div class="hud-dir">
    <button id="b-som" aria-label="Som ligado ou desligado"></button>
    <button id="b-ecra" aria-label="Ecrã inteiro"></button>
    <button id="b-pausa" aria-label="Pausa"></button>
  </div>
  <canvas id="minimapa" width="128" height="80" aria-hidden="true"></canvas>
  <div class="forcas" id="h-forcas" aria-label="Forças ganhas"></div>
</div>

<div id="toque" hidden>
  <div id="joy"><div id="joy-pino"></div></div>
  <span class="dica-joy" id="dica-joy">Arrasta o dedo para andar</span>
  <button id="b-espada" aria-label="Espada"></button>
</div>

<div id="balao" role="status" aria-live="polite"></div>

<section class="ecra ativo" id="ecra-inicio" aria-label="Início">
  <div class="inicio">
    <img src="imagens/capa.jpg" alt="Capa: O Segredo do Farol, autor Gustavo">
    <div class="cartao">
      <span class="etiqueta">Jogo</span>
      <h1 class="titulo-jogo">O Segredo do Farol<small>Gustavo Aventureiro</small></h1>
      <p>Explora o trilho, abre tesouros, ganha forças novas e descobre a luz que mostra o caminho.</p>
      <div class="botoes" id="botoes-inicio"></div>
    </div>
  </div>
</section>

<section class="ecra" id="ecra-pagina" aria-label="Página da história">
  <div class="pagina">
    <img id="pag-img" alt="">
    <div class="cartao">
      <span class="etiqueta" id="pag-etq">História</span>
      <h2 id="pag-titulo"></h2>
      <div class="botoes">
        <button class="bt voz" id="pag-ouvir"></button>
        <button class="bt" id="pag-seguir"></button>
      </div>
    </div>
  </div>
</section>

<section class="ecra" id="ecra-missao" aria-label="Missão"><div class="cartao missao" id="missao"></div></section>
<section class="ecra" id="ecra-forca" aria-label="Força nova"><div class="cartao" id="forca"></div></section>
<section class="ecra" id="ecra-pausa" aria-label="Pausa"><div class="cartao" id="pausa"></div></section>
<section class="ecra" id="ecra-fim" aria-label="Fim"><div class="cartao" id="fim"></div></section>

<noscript><p style="color:#fff;padding:2em">Este jogo precisa de JavaScript ligado.</p></noscript>
<script src="dados.js"></script>
<script src="icones.js"></script>
<script src="rostos.js"></script>
<script src="vendor/three.min.js"></script>
<script src="render3d.js"></script>
<script src="jogo.js"></script>
</body>
</html>
